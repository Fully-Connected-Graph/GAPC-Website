# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Deploy to Github Pages

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-
      - name: Install packages
        run: npm ci --prefer-offline --no-audit --fund=false
      - name: Make build
        run: npm run build
      - name: Add .nojekyll file
        run: touch ./out/.nojekyll
      - name: Deploy to Server
        env:
          SSHPASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y -qq sshpass >/dev/null
          # -c: compare by checksum so unchanged files (~400M of zips/pdfs) are skipped;
          # mtimes are meaningless after a fresh checkout so the default quick-check can't be trusted.
          sshpass -e rsync -rlc --stats \
            -e "ssh -o StrictHostKeyChecking=no -o ConnectTimeout=5" \
            ./out/ "${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/phoenix-storage/srv/fcg/gapc/"
